<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BURING HUB - Pasar Kuliner & Kebutuhan Warga Buring</title>
  <meta name="description" content="Portal pesan makanan & kebutuhan sehari-hari warga Buring, Kedungkandang, Malang. Langsung terhubung ke penjual via WhatsApp.">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen pb-28">

  <!-- TOP NAVBAR -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      
      <!-- Brand & Logo -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="selectMerchant('all')">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white font-black text-xl shadow-md shadow-emerald-600/20">
          🏡
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-extrabold text-slate-900 text-sm sm:text-base leading-tight tracking-wide">BURING HUB</h1>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800">MALANG</span>
          </div>
          <p class="text-[11px] text-slate-500 font-medium">Pasar Kuliner & Kebutuhan Warga</p>
        </div>
      </div>

      <!-- Navigation & Cart Buttons -->
      <div class="flex items-center gap-2">
        <div class="flex bg-slate-100 p-1 rounded-xl">
          <button id="tab-view-menu" onclick="switchView('menu')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-emerald-700 text-white shadow-xs">
            Katalog Menu
          </button>
          <button id="tab-view-recap" onclick="switchView('recap')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-600 hover:text-slate-900">
            Riwayat Order
          </button>
        </div>

        <button onclick="openCartDrawer()" class="relative p-2.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 transition-colors flex items-center justify-center" aria-label="Buka Keranjang">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
          <span id="cart-count-badge" class="hidden absolute -top-1.5 -right-1.5 bg-emerald-600 text-white font-extrabold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">
            0
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-5">

    <!-- VIEW 1: KATALOG MENU -->
    <div id="menu-view">


      <!-- SEARCH & FILTER SECTION -->
      <div class="mb-5 space-y-3">
        <!-- Search bar -->
        <div class="relative">
          <input type="text" id="search-input" placeholder="Cari masakan atau belanjaan... (Tahu telor, mie ayam, sate, lauk pauk, dimsum, beras, sayur)" 
            class="w-full pl-10 pr-4 py-3 rounded-2xl bg-white border border-slate-200 text-xs sm:text-sm shadow-xs focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 transition-all font-medium">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>

        <!-- Category Pills -->
        <div class="overflow-x-auto no-scrollbar py-1 flex items-center gap-2" id="category-pills">
          <!-- Diisi dinamis oleh renderCategoryPills() -->
        </div>

        <!-- Merchant Horizontal Tabs -->
        <div class="overflow-x-auto no-scrollbar py-1 flex items-center gap-2" id="merchant-tabs">
          <!-- Diisi dinamis oleh renderMerchantTabs() -->
        </div>
      </div>

      <!-- ACTIVE MERCHANT BANNER -->
      <div id="merchant-banner" class="hidden"></div>

      <!-- SECTION TITLE -->
      <div class="flex items-center justify-between mb-4">
        <h3 id="product-section-title" class="font-extrabold text-slate-900 text-base sm:text-lg">
          Daftar Menu & Kebutuhan Warga
        </h3>
        <span class="text-xs text-slate-500 font-medium">Bisa pesan dari banyak warung</span>
      </div>

      <!-- PRODUCTS CONTAINER -->
      <div id="products-container">
        <!-- Diisi dinamis oleh renderProducts() -->
      </div>

    </div>

    <!-- VIEW 2: RIWAYAT ORDER -->
    <div id="recap-view" class="hidden">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
        <div>
          <h2 class="text-lg sm:text-xl font-extrabold text-slate-900">Riwayat Pesanan Warga</h2>
          <p class="text-xs text-slate-500 mt-0.5">Daftar pesanan yang telah dikirim ke penjual via WhatsApp.</p>
        </div>
      </div>

      <div id="recap-container">
        <!-- Diisi dinamis oleh renderRecap() -->
      </div>
    </div>

  </main>

  <!-- FLOATING CART BOTTOM BAR -->
  <div id="floating-cart-bar" class="hidden fixed bottom-4 left-4 right-4 max-w-lg mx-auto z-30">
    <div class="bg-slate-900 text-white rounded-2xl p-3.5 sm:p-4 shadow-xl shadow-slate-900/30 border border-slate-800 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-lg">
          🛒
        </div>
        <div>
          <span id="floating-cart-items" class="text-[11px] text-slate-400 block font-medium">0 Menu Dipesan</span>
          <span id="floating-cart-total" class="font-extrabold text-white text-sm sm:text-base leading-none">Rp 0</span>
        </div>
      </div>
      <button onclick="openCartDrawer()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center gap-1.5 shadow-md shadow-emerald-600/20">
        <span>Lihat Keranjang</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- PRODUCT CUSTOMIZATION MODAL -->
  <div id="product-modal" class="hidden fixed inset-0 z-50 overflow-y-auto">
    <div class="fixed inset-0 bg-black/60 backdrop-blur-xs" onclick="closeProductModal()"></div>
    <div class="min-h-full flex items-center justify-center p-4">
      <div id="product-modal-content" class="relative bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
        <!-- Diisi dinamis oleh renderModalContent() -->
      </div>
    </div>
  </div>

  <!-- CART OVERLAY & DRAWER -->
  <div id="cart-overlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 transition-opacity" onclick="closeCartDrawer()"></div>
  <div id="cart-drawer" class="fixed inset-y-0 right-0 max-w-md w-full bg-slate-50 z-50 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
    
    <!-- Drawer Header -->
    <div class="p-4 sm:p-5 bg-white border-b border-slate-200 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🛒</span>
        <div>
          <h3 class="font-bold text-slate-900 text-base">Keranjang Belanja</h3>
          <p class="text-[11px] text-slate-500">Dikelompokkan per masing-masing penjual</p>
        </div>
      </div>
      <button onclick="closeCartDrawer()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center font-bold">✕</button>
    </div>

    <!-- Drawer Body -->
    <div id="cart-items-container" class="flex-1 overflow-y-auto p-4">
      <!-- Diisi dinamis oleh renderCartDrawer() -->
    </div>

  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast-notification" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-full text-xs font-semibold shadow-xl border border-slate-800 transition-all duration-300 transform translate-y-24 opacity-0 pointer-events-none flex items-center gap-2">
    <span>✅</span>
    <span id="toast-text">Notifikasi</span>
  </div>

  <!-- SCRIPTS -->
  <script src="data.js" data-cfasync="false"></script>
  <script src="app.js" data-cfasync="false"></script>
</body>
</html>
